name: Mise à jour et déploiement

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *' # toutes les heures : rafraîchit la vigilance crues / météo
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Semaine courante (cache de correspondance des stations)
        id: week
        run: echo "w=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: .cache
          key: vigicrues-${{ steps.week.outputs.w }}
          restore-keys: vigicrues-

      - name: Données de vigilance
        run: node scripts/build-data.mjs app/data
        env:
          MF_API_KEY: ${{ secrets.MF_API_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
